# Alles, was die App ausmacht, an einer Stelle.
# APPLICATION_ID nie ändern – sonst installiert Android eine zweite App statt eines Updates.
APP_NAME=DATAJOB Inventar
APPLICATION_ID=de.djka.inventar
# Je Release um 0.1 erhöhen; der Tag heißt dann v<VERSION>.
VERSION=1.3
# GitHub-Repo, dessen Releases die App als Updates anbietet.
UPDATE_REPO=Parcival1/inventar-android
